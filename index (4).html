<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"/>
<title>SnapBooth</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;background:#1a0829}
#app{min-height:100vh;background:linear-gradient(135deg,#1a0829 0%,#2d1b4e 40%,#1a2744 100%)}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}

/* WELCOME */
#welcome{align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.hero{position:relative;z-index:1;max-width:380px;width:100%}
.logo{font-size:64px;display:block;margin-bottom:8px;animation:float 3s ease-in-out infinite}
.sub{font-size:11px;letter-spacing:.3em;color:#c084fc;font-weight:700;text-transform:uppercase;margin-bottom:8px}
h1{font-size:clamp(36px,10vw,62px);font-weight:900;background:linear-gradient(135deg,#f9a8d4,#c084fc,#7dd3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.tag{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:28px}
.btn-p{display:block;width:100%;padding:14px;border-radius:50px;background:linear-gradient(135deg,#c084fc,#fb7185);border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;box-shadow:0 0 20px rgba(196,130,247,.4)}
.btn-s{display:block;width:100%;padding:12px;border-radius:50px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.badges{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:24px}
.bdg{padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);font-size:11px;color:rgba(255,255,255,.6)}

/* HEADER */
.hdr{display:flex;align-items:center;padding:11px 14px;gap:10px;background:rgba(0,0,0,.35);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.hdr-title{flex:1;text-align:center;font-weight:700;font-size:15px;color:#c084fc}
.back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:2px 6px}
.ico-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:15px}

/* CAMERA */
#camera{background:#000}
.vf{position:relative;background:#000;display:flex;justify-content:center;flex-shrink:0}
#video{width:100%;max-width:500px;aspect-ratio:3/4;object-fit:cover;display:block}
.mirrored{transform:scaleX(-1)}
.cd-ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-size:100px;font-weight:900;animation:pulse .6s ease-in-out infinite}
.cd-ov.show{display:flex}
.thumbs{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:5px}
.thumb{width:36px;height:28px;border-radius:4px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover}
.fov{position:absolute;inset:0;pointer-events:none;box-sizing:border-box;opacity:.35}

/* PANEL */
.panel{flex:1;background:rgba(0,0,0,.28);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px 14px 0}
.tab{flex:1;padding:7px 4px;border-radius:8px;background:transparent;border:1px solid transparent;color:rgba(255,255,255,.5);font-size:12px;font-weight:600;cursor:pointer}
.tab.on{background:rgba(196,130,247,.25);border-color:#c084fc;color:#c084fc}
.tc{display:none;padding:10px 14px 12px;flex:1;overflow-y:auto}
.tc.on{display:block}

.mg{display:flex;gap:7px;margin-bottom:11px}
.mbtn{flex:1;padding:8px 3px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:600;cursor:pointer}
.mbtn.on{background:linear-gradient(135deg,#c084fc,#fb7185);border-color:transparent}
.mi{font-size:6px;margin-bottom:3px;letter-spacing:2px}
.cdr{display:flex;align-items:center;gap:8px}
.cdl{font-size:13px;color:rgba(255,255,255,.4)}
.cdb{padding:5px 14px;border-radius:20px;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.cdb.on{background:#c084fc}

.crow{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.crow::-webkit-scrollbar{display:none}
.catb{padding:5px 11px;border-radius:20px;white-space:nowrap;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
.catb.on{background:#c084fc}
.frow{display:flex;gap:7px;overflow-x:auto;margin-top:7px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.fsw{width:52px;height:52px;flex-shrink:0;border-radius:10px;border:2px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fsw.on{border-color:#c084fc;box-shadow:0 0 0 2px rgba(196,130,247,.35)}
.fsi{width:78%;height:78%;border-radius:3px;box-sizing:border-box}

.filrow{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filrow::-webkit-scrollbar{display:none}
.fitem{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:3px}
.fth{width:50px;height:50px;border-radius:10px;background:linear-gradient(135deg,#a78bfa,#f9a8d4);border:2px solid transparent;box-sizing:border-box}
.fth.on{border-color:#c084fc}
.fln{font-size:10px;color:rgba(255,255,255,.5);font-weight:600;white-space:nowrap}
.fln.on{color:#c084fc}

.shut-bar{padding:13px;display:flex;justify-content:center;background:rgba(0,0,0,.3);flex-shrink:0}
.shut{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#c084fc,#fb7185);border:4px solid rgba(255,255,255,.4);cursor:pointer;font-size:25px;box-shadow:0 0 28px rgba(196,130,247,.55)}
.shut:disabled{background:rgba(255,255,255,.15);box-shadow:none;cursor:not-allowed}

/* PREVIEW */
#preview{background:linear-gradient(135deg,#1a0829,#2d1b4e)}
.parea{flex:1;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.strip{display:inline-block;border-radius:8px}
.strip-img{width:100%;display:block;border-radius:3px}
.strip-cap{text-align:center;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.1em}
.strip-br{text-align:center;margin-top:3px;font-size:9px;letter-spacing:.18em;opacity:.55}
.abar{display:flex;gap:9px;padding:11px 14px;background:rgba(0,0,0,.3);flex-shrink:0}
.btn-g{flex:1;padding:11px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn-d{flex:1;padding:11px;border-radius:12px;background:linear-gradient(135deg,#c084fc,#fb7185);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.tinp{width:100%;padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;outline:none;font-family:inherit}
.tinp::placeholder{color:rgba(255,255,255,.35)}
.qtags{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.qtag{padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);font-size:11px;cursor:pointer}

/* GALLERY */
#gallery{background:linear-gradient(135deg,#1a0829,#2d1b4e)}
.ggrid{flex:1;overflow-y:auto;padding:13px;display:grid;grid-template-columns:repeat(2,1fr);gap:11px;align-content:start}
.gcard{border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.12)}
.gcinner{padding:7px}
.gcimg{width:100%;display:block;border-radius:3px;margin-bottom:3px}
.gcmeta{padding:2px 7px 7px;text-align:center;font-size:10px;font-weight:600}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:.5}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;padding:18px}
.modal-bg.show{display:flex}
.mbox{max-width:320px;width:100%;border-radius:16px;overflow:hidden}
.mbody{padding:11px}
.mimg{width:100%;border-radius:3px;display:block;margin-bottom:5px}
.mcap{text-align:center;padding:3px 0;font-size:12px;font-weight:700}
.mbr{text-align:center;font-size:9px;opacity:.45}
.mact{display:flex;gap:7px;padding:0 11px 11px}
.mdl{flex:1;padding:10px;border-radius:10px;background:#c084fc;border:none;color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.mdel{padding:10px 14px;border-radius:10px;background:#f43f5e;border:none;color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.mclose{margin-top:12px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 22px;border-radius:20px;cursor:pointer;font-size:14px}

/* FLASH */
#flash{position:fixed;inset:0;background:#fff;z-index:999;pointer-events:none;opacity:0}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.1)}}
</style>
</head>
<body>
<div id="app">
  <div id="flash"></div>

  <!-- WELCOME -->
  <div id="welcome" class="screen active">
    <div class="orb" style="top:5%;left:5%;width:260px;height:260px;background:#c084fc33;animation:float 4s ease-in-out infinite"></div>
    <div class="orb" style="top:55%;right:4%;width:200px;height:200px;background:#fb718544;animation:float 5s ease-in-out infinite .8s"></div>
    <div class="orb" style="top:20%;right:15%;width:150px;height:150px;background:#38bdf844;animation:float 3.5s ease-in-out infinite 1.4s"></div>
    <div class="hero">
      <span class="logo">📸</span>
      <div class="sub">✦ Modern Photo Booth ✦</div>
      <h1>SnapBooth</h1>
      <p class="tag">Korean-style photo booth · capture &amp; create ✨</p>
      <button class="btn-p" onclick="go('camera')">📷 Mulai Foto</button>
      <button class="btn-s" id="galbtn" onclick="go('gallery')">🖼 Galeri Hasil</button>
      <div class="badges">
        <span class="bdg">🎞 Strip Mode</span>
        <span class="bdg">✨ 30+ Frames</span>
        <span class="bdg">🎨 8 Filters</span>
        <span class="bdg">💾 Gallery</span>
        <span class="bdg">📥 Download</span>
      </div>
    </div>
  </div>

  <!-- CAMERA -->
  <div id="camera" class="screen">
    <div class="hdr">
      <button class="back" onclick="goBack()">←</button>
      <span class="hdr-title">📷 Kamera</span>
      <button class="ico-btn" onclick="swCam()">🔄</button>
    </div>
    <div class="vf">
      <video id="video" autoplay playsinline muted></video>
      <div class="cd-ov" id="cdov">3</div>
      <div class="thumbs" id="thumbs"></div>
      <div class="fov" id="fov"></div>
    </div>
    <div class="panel">
      <div class="tabs">
        <button class="tab on" onclick="stab(this,'tm')">🎞 Mode</button>
        <button class="tab" onclick="stab(this,'tf')">🖼 Frame</button>
        <button class="tab" onclick="stab(this,'tfi')">🎨 Filter</button>
      </div>
      <div class="tc on" id="tm">
        <div class="mg" id="mg"></div>
        <div class="cdr">
          <span class="cdl">⏱</span>
          <button class="cdb on" onclick="scd(this,3)">3s</button>
          <button class="cdb" onclick="scd(this,5)">5s</button>
          <button class="cdb" onclick="scd(this,10)">10s</button>
        </div>
      </div>
      <div class="tc" id="tf">
        <div class="crow" id="ccat"></div>
        <div class="frow" id="cfr"></div>
      </div>
      <div class="tc" id="tfi">
        <div class="filrow" id="cfil"></div>
      </div>
    </div>
    <div class="shut-bar">
      <button class="shut" id="shutbtn" onclick="shoot()">📷</button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="screen">
    <div class="hdr">
      <button class="back" onclick="reset()">←</button>
      <span class="hdr-title">✨ Preview</span>
      <button class="btn-p" style="padding:7px 14px;font-size:13px;margin:0;display:inline-block;width:auto" onclick="save()">💾 Simpan</button>
    </div>
    <div class="parea"><div id="sout"></div></div>
    <div class="panel">
      <div class="tabs">
        <button class="tab on" onclick="stab(this,'ptf')">🖼 Frame</button>
        <button class="tab" onclick="stab(this,'ptfi')">🎨 Filter</button>
        <button class="tab" onclick="stab(this,'ptt')">✏️ Teks</button>
      </div>
      <div class="tc on" id="ptf">
        <div class="crow" id="pcat"></div>
        <div class="frow" id="pfr"></div>
      </div>
      <div class="tc" id="ptfi">
        <div class="filrow" id="pfil"></div>
      </div>
      <div class="tc" id="ptt">
        <input class="tinp" id="capin" placeholder="Tambahkan caption... (nama, tanggal, quotes)" oninput="upcap(this.value)"/>
        <div class="qtags">
          <button class="qtag" onclick="setcap('Best Day Ever ✨')">Best Day Ever ✨</button>
          <button class="qtag" onclick="setcap('Happy Birthday! 🎂')">Happy Birthday! 🎂</button>
          <button class="qtag" onclick="setcap('Friends Forever 💕')">Friends Forever 💕</button>
          <button class="qtag" id="dttag"></button>
        </div>
      </div>
    </div>
    <div class="abar">
      <button class="btn-g" onclick="reset()">🔄 Ambil Ulang</button>
      <button class="btn-d" onclick="dl()">📥 Download</button>
    </div>
  </div>

  <!-- GALLERY -->
  <div id="gallery" class="screen">
    <div class="hdr">
      <button class="back" onclick="go('welcome')">←</button>
      <span class="hdr-title" id="gtitle">🖼 Galeri</span>
      <button class="ico-btn" onclick="go('camera')" style="font-size:18px;padding:5px 10px">+</button>
    </div>
    <div class="ggrid" id="ggrid"></div>
    <div class="empty" id="gempty" style="display:none">
      <div style="font-size:52px">📭</div>
      <p>Belum ada foto tersimpan</p>
      <button class="btn-p" style="width:auto;padding:9px 22px" onclick="go('camera')">Mulai Foto</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-bg" id="modal" onclick="cmod(event)">
    <div class="mbox" id="mbox"></div>
    <button class="mclose" onclick="closeModal()">Tutup</button>
  </div>
</div>

<canvas id="cc" style="display:none"></canvas>
<canvas id="ec" style="display:none"></canvas>

<script>
var FRAMES={
  "Korean Style":[
    {id:"kw",label:"K-White",  border:"10px solid #fff",    bg:"#fff",    text:"#222"},
    {id:"kp",label:"Soft Pink",border:"10px solid #fda4af", bg:"#fff1f2", text:"#881337"},
    {id:"kb",label:"Beige",    border:"10px solid #e7d9c7", bg:"#fdf8f0", text:"#78350f"},
    {id:"ks",label:"Sky Blue", border:"10px solid #7dd3fc", bg:"#f0f9ff", text:"#0c4a6e"},
  ],
  Minimalist:[
    {id:"mw",label:"White",    border:"8px solid #fff",    bg:"#fff",    text:"#333"},
    {id:"mb",label:"Black",    border:"8px solid #111",    bg:"#111",    text:"#fff"},
    {id:"mc",label:"Cream",    border:"8px solid #f5f0e8", bg:"#f5f0e8", text:"#555"},
    {id:"mg2",label:"Gray",    border:"8px solid #d1d5db", bg:"#e5e7eb", text:"#374151"},
  ],
  Pastel:[
    {id:"pp",label:"Pink",     border:"8px solid #fbcfe8",bg:"#fce7f3",text:"#9d174d"},
    {id:"pb",label:"Baby Blue",border:"8px solid #bfdbfe",bg:"#dbeafe",text:"#1e40af"},
    {id:"pl",label:"Lavender", border:"8px solid #c4b5fd",bg:"#ede9fe",text:"#5b21b6"},
    {id:"pm",label:"Mint",     border:"8px solid #a7f3d0",bg:"#d1fae5",text:"#065f46"},
  ],
  Birthday:[
    {id:"bd",label:"🎂 Cake",    border:"8px dashed #f472b6",bg:"#fdf2f8",text:"#9d174d"},
    {id:"bl",label:"🎈 Balloon", border:"8px solid #fb923c", bg:"#fff7ed",text:"#9a3412"},
    {id:"bc",label:"🎉 Confetti",border:"8px dotted #a855f7",bg:"#faf5ff",text:"#581c87"},
  ],
  Romantic:[
    {id:"rl",label:"❤️ Love",  border:"8px solid #f43f5e",bg:"#fff1f2",text:"#9f1239"},
    {id:"rr",label:"🌹 Rose",  border:"8px solid #e11d48",bg:"#fce7f3",text:"#9d174d"},
    {id:"rv",label:"🪷 Velvet",border:"8px solid #a21caf",bg:"#fdf4ff",text:"#701a75"},
  ],
  Neon:[
    {id:"nc",label:"⚡ Cyber",  border:"8px solid #facc15",bg:"#0a0a0a",text:"#facc15"},
    {id:"np",label:"💜 Purple", border:"8px solid #a855f7",bg:"#0f0a1e", text:"#d8b4fe"},
    {id:"nb",label:"💙 Blue",   border:"8px solid #38bdf8",bg:"#030712", text:"#7dd3fc"},
    {id:"ng",label:"💚 Green",  border:"8px solid #4ade80",bg:"#011007", text:"#86efac"},
  ],
  Anime:[
    {id:"as",label:"🌸 Sakura",    border:"8px solid #f9a8d4",bg:"#fdf2f8",text:"#831843"},
    {id:"ak",label:"✨ Kawaii",    border:"8px solid #c084fc",bg:"#faf5ff",text:"#581c87"},
    {id:"ay",label:"☁️ Sky Anime", border:"8px solid #7dd3fc",bg:"#f0f9ff",text:"#0c4a6e"},
  ],
  Graduation:[
    {id:"gg",label:"🎓 Gold",  border:"8px solid #ca8a04",bg:"#fefce8",text:"#713f12"},
    {id:"gs",label:"📚 School",border:"8px solid #1d4ed8",bg:"#eff6ff",text:"#1e3a8a"},
  ],
  Friendship:[
    {id:"fb",label:"👯 Best Friends",border:"8px solid #fbbf24",bg:"#fffbeb",text:"#92400e"},
    {id:"fm",label:"📷 Memories",   border:"8px solid #6ee7b7",bg:"#ecfdf5",text:"#065f46"},
  ],
};

var FILTERS=[
  {id:"none",   label:"Original", css:"none"},
  {id:"vintage",label:"Vintage",  css:"sepia(0.5) contrast(1.1) brightness(0.9)"},
  {id:"retro",  label:"Retro",    css:"sepia(0.8) saturate(0.7) hue-rotate(10deg)"},
  {id:"warm",   label:"Warm",     css:"sepia(0.2) saturate(1.4) brightness(1.05) hue-rotate(-10deg)"},
  {id:"cool",   label:"Cool",     css:"saturate(0.9) hue-rotate(20deg) brightness(1.05)"},
  {id:"bw",     label:"B&W",      css:"grayscale(1) contrast(1.1)"},
  {id:"glow",   label:"Soft Glow",css:"brightness(1.15) saturate(1.2) contrast(0.9)"},
  {id:"vivid",  label:"Vivid",    css:"saturate(1.6) contrast(1.1)"},
];

var MODES=[{id:1,label:"Single",icon:"▪"},{id:2,label:"Double",icon:"▪▪"},{id:3,label:"Triple",icon:"▪▪▪"},{id:4,label:"Classic",icon:"▪▪▪▪"}];

var S={
  mode:4, facing:"user", cd:3, busy:false,
  frame:FRAMES["Korean Style"][0], fcat:"Korean Style",
  filter:FILTERS[0],
  session:[], idx:0,
  cap:"", gallery:[], stream:null
};

function go(name){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(name).classList.add('active');
  if(name==='camera') startCam();
  if(name==='gallery') renderGal();
  if(name==='welcome') updGalBtn();
  if(name==='preview') renderStrip();
}
function goBack(){stopCam();go('welcome');}
function updGalBtn(){
  var b=document.getElementById('galbtn');
  b.textContent=S.gallery.length?'🖼 Galeri Hasil ('+S.gallery.length+')':'🖼 Galeri Hasil';
}

function stab(btn,tid){
  var p=btn.closest('.panel');
  p.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  p.querySelectorAll('.tc').forEach(function(c){c.classList.remove('on');});
  btn.classList.add('on');
  document.getElementById(tid).classList.add('on');
}

async function startCam(){
  stopCam();
  try{
    var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.facing},audio:false});
    S.stream=s;
    var v=document.getElementById('video');
    v.srcObject=s;
    v.className=S.facing==='user'?'mirrored':'';
    v.style.filter=S.filter.css!=='none'?S.filter.css:'';
    updFov();
  }catch(e){
    alert('Tidak dapat mengakses kamera.\nPastikan izin kamera sudah diberikan.\n'+e.message);
  }
}
function stopCam(){
  if(S.stream){S.stream.getTracks().forEach(function(t){t.stop();});S.stream=null;}
}
function swCam(){S.facing=S.facing==='user'?'environment':'user';startCam();}
function updFov(){document.getElementById('fov').style.border=S.frame.border;}

function scd(btn,v){
  S.cd=v;
  document.querySelectorAll('.cdb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
}

async function shoot(){
  if(S.busy)return;
  S.busy=true;
  var sb=document.getElementById('shutbtn');
  sb.disabled=true;
  for(var i=S.idx;i<S.mode;i++){
    for(var c=S.cd;c>0;c--){showCd(c);await wait(1000);}
    hideCd();
    flash();
    var img=captureFrame();
    if(img){S.session.push(img);updThumbs();}
    S.idx++;
    if(i<S.mode-1)await wait(600);
  }
  S.busy=false;
  sb.disabled=false;
  if(S.session.length>=S.mode){stopCam();go('preview');}
}

function captureFrame(){
  var v   = document.getElementById('video');
  var vW  = v.videoWidth  || 640;
  var vH  = v.videoHeight || 480;

  /* Output SELALU portrait 3:4 → 720×960 px */
  var OW = 720, OH = 960;
  var oAR = OW / OH;   /* 0.75 */
  var vAR = vW / vH;

  /* Hitung crop tengah agar object-fit:cover portrait */
  var sx, sy, sw, sh;
  if(vAR > oAR){
    /* Landscape → pakai full tinggi, potong sisi kiri & kanan */
    sh = vH;
    sw = Math.round(vH * oAR);
    sx = Math.floor((vW - sw) / 2);
    sy = 0;
  } else {
    /* Portrait/square → pakai full lebar, potong atas & bawah */
    sw = vW;
    sh = Math.round(vW / oAR);
    sx = 0;
    sy = Math.floor((vH - sh) / 2);
  }

  var c   = document.getElementById('cc');
  c.width = OW; c.height = OH;          /* set size → auto-reset ctx */
  var ctx = c.getContext('2d');

  /* Mirror untuk kamera depan */
  if(S.facing === 'user'){
    ctx.translate(OW, 0);
    ctx.scale(-1, 1);
  }

  /* Terapkan filter */
  ctx.filter = (S.filter.css !== 'none') ? S.filter.css : '';

  /* Crop dari video → canvas portrait 720×960 */
  ctx.drawImage(v, sx, sy, sw, sh, 0, 0, OW, OH);

  return c.toDataURL('image/jpeg', 0.92);
}

function updThumbs(){
  var el=document.getElementById('thumbs');
  el.innerHTML='';
  for(var i=0;i<S.mode;i++){
    var d=document.createElement('div');
    d.className='thumb';
    if(S.session[i]){
      var img=document.createElement('img');
      img.src=S.session[i];
      d.appendChild(img);
    }else if(i===S.idx){d.textContent='▶';}
    el.appendChild(d);
  }
}

function showCd(n){var e=document.getElementById('cdov');e.textContent=n;e.classList.add('show');}
function hideCd(){document.getElementById('cdov').classList.remove('show');}
function flash(){var f=document.getElementById('flash');f.style.animation='none';void f.offsetWidth;f.style.animation='fl .3s ease-out forwards';}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}

/* BUILD SELECTORS */
function buildModes(){
  var el=document.getElementById('mg');el.innerHTML='';
  MODES.forEach(function(m){
    var b=document.createElement('button');
    b.className='mbtn'+(m.id===S.mode?' on':'');
    b.innerHTML='<div class="mi">'+m.icon+'</div>'+m.label;
    b.onclick=function(){
      S.mode=m.id;S.session=[];S.idx=0;updThumbs();
      el.querySelectorAll('.mbtn').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
    };
    el.appendChild(b);
  });
}

function buildCats(cid,fid,ctx2){
  var cel=document.getElementById(cid);cel.innerHTML='';
  Object.keys(FRAMES).forEach(function(cat){
    var b=document.createElement('button');
    b.className='catb'+(cat===S.fcat?' on':'');
    b.textContent=cat;
    b.onclick=function(){
      S.fcat=cat;
      cel.querySelectorAll('.catb').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      buildFList(fid,ctx2);
    };
    cel.appendChild(b);
  });
  buildFList(fid,ctx2);
}

function buildFList(fid,ctx2){
  var el=document.getElementById(fid);el.innerHTML='';
  FRAMES[S.fcat].forEach(function(f){
    var b=document.createElement('button');
    b.className='fsw'+(f.id===S.frame.id?' on':'');
    b.style.background=f.bg||'#fff';
    var inner=document.createElement('div');
    inner.className='fsi';inner.style.border=f.border;
    b.appendChild(inner);b.title=f.label;
    b.onclick=function(){
      S.frame=f;
      el.querySelectorAll('.fsw').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      updFov();
      if(ctx2==='preview')renderStrip();
    };
    el.appendChild(b);
  });
}

function buildFils(fid,ctx2){
  var el=document.getElementById(fid);el.innerHTML='';
  FILTERS.forEach(function(f){
    var b=document.createElement('button');b.className='fitem';
    var th=document.createElement('div');th.className='fth'+(f.id===S.filter.id?' on':'');
    th.style.filter=f.css!=='none'?f.css:'';
    var ln=document.createElement('span');ln.className='fln'+(f.id===S.filter.id?' on':'');ln.textContent=f.label;
    b.appendChild(th);b.appendChild(ln);
    b.onclick=function(){
      S.filter=f;
      if(ctx2==='camera'){
        var v=document.getElementById('video');
        v.style.filter=f.css!=='none'?f.css:'';
      }
      el.querySelectorAll('.fth').forEach(function(x){x.classList.remove('on');});
      el.querySelectorAll('.fln').forEach(function(x){x.classList.remove('on');});
      th.classList.add('on');ln.classList.add('on');
      if(ctx2==='preview')renderStrip();
    };
    el.appendChild(b);
  });
}

/* STRIP */
function renderStrip(){
  var out=document.getElementById('sout');
  if(!out)return;
  var f=S.frame,multi=S.mode>1;
  var w=document.createElement('div');
  w.className='strip';
  w.style.background=f.bg||'#fff';
  w.style.padding=multi?'10px':'8px';
  w.style.maxWidth=multi?'200px':'260px';
  S.session.slice(0,S.mode).forEach(function(src,i){
    var iw=document.createElement('div');
    iw.style.cssText='border-radius:3px;overflow:hidden;line-height:0;border:'+f.border+(i>0?';margin-top:6px':'');
    var img=document.createElement('img');
    img.src=src;img.className='strip-img';
    img.style.filter=S.filter.css!=='none'?S.filter.css:'';
    iw.appendChild(img);w.appendChild(iw);
  });
  if(S.cap){
    var cap=document.createElement('div');cap.className='strip-cap';
    cap.style.color=f.text||'#333';cap.textContent=S.cap;w.appendChild(cap);
  }
  var br=document.createElement('div');br.className='strip-br';
  br.style.color=f.text||'#333';br.textContent='✦ SNAPBOOTH ✦';w.appendChild(br);
  out.innerHTML='';out.appendChild(w);
}

function upcap(v){S.cap=v;renderStrip();}
function setcap(v){S.cap=v;document.getElementById('capin').value=v;renderStrip();}

function dl(){buildComp(S.session,S.frame,S.filter,S.mode,S.cap,'snapbooth-'+Date.now()+'.png');}

function buildComp(photos,frame,filt,mode,cap,fname){
  // Step 1: load all images first to get real dimensions
  var list=photos.slice(0,mode);
  var loaded=[];
  var done=0;
  list.forEach(function(src,i){
    var img=new Image();
    img.onload=function(){
      loaded[i]=img;
      done++;
      if(done===list.length) compose(loaded,frame,filt,mode,cap,fname);
    };
    img.src=src;
  });
}

function compose(imgs,frame,filt,mode,cap,fname){
  /* ─────────────────────────────────────────────────────────────────────
     Setiap foto dari captureFrame disimpan portrait (tinggi > lebar).
     Kita baca rasio ASLI dari gambar pertama agar tidak pernah gepeng.
  ───────────────────────────────────────────────────────────────────── */

  /* Dimensi asli foto dari foto pertama */
  var natW = imgs[0].naturalWidth  || 600;
  var natH = imgs[0].naturalHeight || 800;

  /* Paksa portrait: kalau entah bagaimana hasilnya landscape, balik */
  if(natW > natH){ var _t=natW; natW=natH; natH=_t; }

  /* Layout strip */
  var PAD  = 40;           /* padding luar (px) */
  var GAP  = 14;           /* jarak antar foto (px) */
  var BORD = 8;            /* tebal border stroke (px) */

  /* Lebar foto dalam strip – skala hingga maks 900 px */
  var PW = Math.min(Math.round(natW * 1.5), 900);
  /* Tinggi foto = lebar × rasio asli → PORTRAIT terjaga */
  var PH = Math.round(PW * natH / natW);

  var W      = PW + PAD * 2;
  var footH  = cap ? 72 : 44;
  var totalH = PAD + mode * PH + (mode - 1) * GAP + footH;

  var c   = document.getElementById('ec');
  c.width = W; c.height = totalH;
  var ctx = c.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);          /* reset transform */
  ctx.clearRect(0, 0, W, totalH);

  /* Background */
  ctx.fillStyle = frame.bg || '#ffffff';
  ctx.fillRect(0, 0, W, totalH);

  /* Gambar setiap foto */
  for(var i = 0; i < mode; i++){
    if(!imgs[i]) continue;
    var px = PAD;
    var py = PAD + i * (PH + GAP);

    /* Filter */
    ctx.save();
    ctx.filter = (filt.css !== 'none') ? filt.css : '';
    /* 5-argumen: draw seluruh src → PW × PH (tidak ada crop src) */
    ctx.drawImage(imgs[i], px, py, PW, PH);
    ctx.restore();                         /* filter direset di sini */

    /* Border */
    var bcm = (frame.border || '').match(/#[0-9a-fA-F]{3,6}/i);
    if(bcm){
      ctx.strokeStyle = bcm[0];
      ctx.lineWidth   = BORD;
      ctx.strokeRect(px + BORD/2, py + BORD/2, PW - BORD, PH - BORD);
    }
  }

  /* Footer area */
  var footTop = PAD + mode * PH + (mode - 1) * GAP;

  if(cap){
    ctx.fillStyle    = frame.text || '#333333';
    ctx.font         = 'bold 26px sans-serif';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(cap, W / 2, footTop + 12);

    ctx.fillStyle    = (frame.text || '#333333') + '99';
    ctx.font         = '16px sans-serif';
    ctx.fillText('✦ SNAPBOOTH ✦', W / 2, footTop + 46);
  } else {
    ctx.fillStyle    = (frame.text || '#333333') + '99';
    ctx.font         = '16px sans-serif';
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✦ SNAPBOOTH ✦', W / 2, footTop + footH / 2);
  }

  var a = document.createElement('a');
  a.href     = c.toDataURL('image/png');
  a.download = fname;
  a.click();
}

/* GALLERY */
function save(){
  S.gallery.unshift({id:Date.now(),photos:S.session.slice(),frame:Object.assign({},S.frame),filter:Object.assign({},S.filter),cap:S.cap,mode:S.mode,date:new Date()});
  reset();go('gallery');
}
function reset(){S.session=[];S.idx=0;S.cap='';var i=document.getElementById('capin');if(i)i.value='';go('camera');}

function renderGal(){
  var grid=document.getElementById('ggrid'),empty=document.getElementById('gempty');
  document.getElementById('gtitle').textContent='🖼 Galeri ('+S.gallery.length+')';
  grid.innerHTML='';
  if(!S.gallery.length){grid.style.display='none';empty.style.display='flex';return;}
  grid.style.display='grid';empty.style.display='none';
  S.gallery.forEach(function(e){
    var card=document.createElement('div');card.className='gcard';card.style.background=e.frame.bg||'#fff';
    var inn=document.createElement('div');inn.className='gcinner';
    e.photos.slice(0,Math.min(e.mode,2)).forEach(function(src,i){
      var img=document.createElement('img');img.src=src;img.className='gcimg';
      img.style.filter=e.filter.css!=='none'?e.filter.css:'';
      img.style.border=e.frame.border;
      if(i>0)img.style.marginTop='4px';
      inn.appendChild(img);
    });
    var meta=document.createElement('div');meta.className='gcmeta';
    meta.style.color=(e.frame.text||'#333')+'aa';
    meta.textContent=e.date.toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' · '+e.mode+' foto';
    card.appendChild(inn);card.appendChild(meta);
    card.onclick=function(){openModal(e);};
    grid.appendChild(card);
  });
  updGalBtn();
}

var _me=null;
function openModal(e){
  _me=e;
  var box=document.getElementById('mbox');
  box.style.background=e.frame.bg||'#fff';
  var h='<div class="mbody">';
  e.photos.slice(0,e.mode).forEach(function(src,i){
    h+='<img src="'+src+'" class="mimg" style="filter:'+(e.filter.css!=='none'?e.filter.css:'none')+';border:'+e.frame.border+(i>0?';margin-top:6px':'')+'"/>';
  });
  if(e.cap)h+='<div class="mcap" style="color:'+(e.frame.text||'#333')+'">'+e.cap+'</div>';
  h+='<div class="mbr" style="color:'+(e.frame.text||'#333')+'">✦ SNAPBOOTH ✦</div></div>';
  h+='<div class="mact"><button class="mdl" onclick="dlEntry()">📥 Download</button><button class="mdel" onclick="delEntry()">🗑</button></div>';
  box.innerHTML=h;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function cmod(ev){if(ev.target===document.getElementById('modal'))closeModal();}
function dlEntry(){if(_me)buildComp(_me.photos,_me.frame,_me.filter,_me.mode,_me.cap,'snapbooth-'+_me.id+'.png');}

function delEntry(){if(_me){S.gallery=S.gallery.filter(function(x){return x.id!==_me.id;});closeModal();renderGal();}}

/* INIT */
(function init(){
  var dt=new Date().toLocaleDateString('id-ID');
  var dtag=document.getElementById('dttag');
  if(dtag){dtag.textContent=dt;dtag.onclick=function(){setcap(dt);};}
  buildModes();
  buildCats('ccat','cfr','camera');
  buildFils('cfil','camera');
  buildCats('pcat','pfr','preview');
  buildFils('pfil','preview');
})();
</script>
